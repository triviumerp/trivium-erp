<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seja um Parceiro Afiliado - Trivium ERP</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }
        .card-registro {
            max-width: 540px;
            width: 100%;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 20px;
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.05);
            padding: 2.5rem;
        }
        .brand-logo-text {
            font-size: 1.6rem;
            font-weight: 800;
            letter-spacing: -0.8px;
            color: #1e3a8a;
            text-decoration: none;
        }
        .brand-logo-text span {
            color: #2563eb;
        }
    </style>
</head>
<body>

    <div class="card-registro">
        <div class="text-center mb-4">
            <a href="{{ url_for('auth.login') }}" class="brand-logo-text">Trivium <span>ERP</span></a>
            <p class="text-muted small mt-1">Programa de Parceria & Afiliados</p>
        </div>

        <!-- Mensagens Flash -->
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
            <div class="alert alert-{{ category if category != 'error' else 'danger' }} alert-dismissible fade show small mb-3" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            {% endfor %}
        {% endif %}
        {% endwith %}

        <form method="POST" id="formAfiliado">
            <div class="mb-3">
                <label class="form-label small fw-bold">Seu Nome Completo *</label>
                <input type="text" name="nome" class="form-control form-control-sm" required placeholder="Nome do parceiro">
            </div>

            <div class="row g-2 mb-3">
                <div class="col-md-6">
                    <label class="form-label small fw-bold">CPF ou CNPJ *</label>
                    <input type="text" name="cpf_cnpj" class="form-control form-control-sm font-monospace" required placeholder="000.000.000-00">
                </div>
                <div class="col-md-6">
                    <label class="form-label small fw-bold">Perfil de Atuação</label>
                    <select name="tipo_parceiro" class="form-select form-select-sm">
                        <option value="Consultor / Técnico">Consultor / Técnico em Segurança</option>
                        <option value="Criador de Conteúdo">Criador de Conteúdo / Influenciador</option>
                        <option value="Contador / Assessor">Contador / Assessor</option>
                        <option value="Outros">Outros</option>
                    </select>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label small fw-bold">Rede Social Principal ou Canal</label>
                <input type="text" name="rede_social_principal" class="form-control form-control-sm" placeholder="Ex: instagram.com/seuusuario ou YouTube">
            </div>

            <!-- E-MAIL E CONFIRMAÇÃO DE E-MAIL -->
            <div class="mb-3">
                <label class="form-label small fw-bold">E-mail de Acesso *</label>
                <input type="email" name="email" id="email" class="form-control form-control-sm" required placeholder="seu@email.com">
            </div>

            <div class="mb-3">
                <label class="form-label small fw-bold">Confirme seu E-mail *</label>
                <input type="email" name="confirma_email" id="confirma_email" class="form-control form-control-sm" required placeholder="Digite o e-mail novamente">
                <div class="invalid-feedback">Os e-mails digitados não conferem.</div>
            </div>

            <!-- SENHAS -->
            <div class="row g-2 mb-4">
                <div class="col-md-6">
                    <label class="form-label small fw-bold">Senha de Acesso *</label>
                    <input type="password" name="senha" class="form-control form-control-sm" required placeholder="Mínimo 8 caracteres">
                </div>
                <div class="col-md-6">
                    <label class="form-label small fw-bold">Confirme a Senha *</label>
                    <input type="password" name="confirma_senha" class="form-control form-control-sm" required placeholder="Repita a senha">
                </div>
            </div>

            <button type="submit" class="btn btn-dark fw-bold w-100 py-2 shadow-sm mb-3">
                <i class="bi bi-person-badge me-1"></i> Cadastrar como Parceiro Afiliado
            </button>

            <div class="text-center small">
                <span class="text-muted">Já possui conta?</span> <a href="{{ url_for('auth.login') }}" class="fw-bold text-decoration-none">Faça login</a>
            </div>
        </form>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const emailInput = document.getElementById('email');
        const confirmaInput = document.getElementById('confirma_email');
        const form = document.getElementById('formAfiliado');

        if (form && emailInput && confirmaInput) {
            form.addEventListener('submit', (e) => {
                if (emailInput.value.trim().toLowerCase() !== confirmaInput.value.trim().toLowerCase()) {
                    e.preventDefault();
                    confirmaInput.classList.add('is-invalid');
                    alert('Os campos de e-mail não conferem. Por favor, revise a digitação.');
                    confirmaInput.focus();
                } else {
                    confirmaInput.classList.remove('is-invalid');
                }
            });
        }
    });
    </script>
</body>
</html>
