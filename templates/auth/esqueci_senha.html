<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Senha - Trivium ERP</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        :root {
            --brand-blue: #1e3a8a;
            --brand-accent: #2563eb;
            --bg-body: #f8fafc;
            --border-color: #e2e8f0;
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: var(--bg-body); 
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            padding: 1.5rem;
        }

        .login-card { 
            background: #ffffff; 
            border: 1px solid var(--border-color); 
            border-radius: 20px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.05); 
            width: 100%; 
            max-width: 440px; 
            padding: 2.5rem; 
        }

        .brand-logo-text {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.8px;
            color: var(--brand-blue);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            text-decoration: none;
            margin-bottom: 1.25rem;
        }
        .brand-logo-text span {
            color: var(--brand-accent);
        }

        .btn-brand { 
            background-color: var(--brand-blue); 
            color: #fff; 
            font-weight: 700; 
            border-radius: 10px; 
            padding: 12px; 
            transition: all 0.2s ease;
        }
        .btn-brand:hover { 
            background-color: var(--brand-accent); 
            color: #fff; 
        }
    </style>
</head>
<body>

    <div class="login-card">
        <!-- CABEÇALHO -->
        <div class="text-center">
            <a href="{{ url_for('auth.login') }}" class="brand-logo-text">
                <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Trivium ERP" style="height: 32px;" onerror="this.style.display='none'">
                Trivium <span>ERP</span>
            </a>
            <h4 class="fw-bold text-dark mb-1">Recuperar Senha</h4>
            <p class="text-muted small">Informe seu e-mail ou CNPJ/CPF para enviarmos o link de recuperação</p>
        </div>

        <!-- MENSAGENS FLASH DO SISTEMA -->
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
            <div class="alert alert-{{ category if category != 'error' else 'danger' }} alert-dismissible fade show small py-2 px-3 mb-3" role="alert">
                {{ message }}
                <button type="button" class="btn-close py-2" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            {% endfor %}
        {% endif %}
        {% endwith %}

        <!-- FORMULÁRIO -->
        <form method="POST" action="{{ url_for('auth.esqueci_senha') }}">
            <div class="mb-4">
                <label class="form-label small fw-bold text-dark">E-mail ou CNPJ/CPF</label>
                <div class="input-group">
                    <span class="input-group-text bg-light text-muted border-end-0">
                        <i class="bi bi-person-badge"></i>
                    </span>
                    <input type="text" name="email" class="form-control border-start-0 ps-0" placeholder="seu@email.com ou documento" required autofocus>
                </div>
            </div>
            
            <button type="submit" class="btn btn-brand w-100 mb-3 shadow-sm">
                <i class="bi bi-envelope-paper me-1"></i> Enviar Link de Recuperação
            </button>
        </form>

        <div class="text-center pt-2 border-top">
            <a href="{{ url_for('auth.login') }}" class="small text-muted text-decoration-none fw-semibold">
                <i class="bi bi-arrow-left me-1"></i> Voltar ao Login
            </a>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
