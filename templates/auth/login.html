<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Trivium ERP</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 100%; max-width: 440px; padding: 2.5rem; }
        .btn-brand { background-color: #1e3a8a; color: #fff; font-weight: 700; border-radius: 10px; padding: 12px; }
        .btn-brand:hover { background-color: #2563eb; color: #fff; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="text-center mb-4">
            <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Trivium ERP" style="height: 48px; width: auto; object-fit: contain;" class="mb-2" onerror="this.style.display='none'">
            <h3 class="fw-bold text-primary mb-1">Trivium <span class="text-dark">ERP</span></h3>
            <p class="text-muted small">Acesse seu painel corporativo</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category if category != 'error' else 'danger' }} small py-2">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">
            <div class="mb-3">
                <label class="form-label small fw-bold">E-mail Corporativo</label>
                <input type="email" name="email" class="form-control" placeholder="seu@email.com" required>
            </div>
            <div class="mb-2">
                <div class="d-flex justify-content-between align-items-center">
                    <label class="form-label small fw-bold mb-0">Senha de Acesso</label>
                    <a href="{{ url_for('auth.esqueci_senha') }}" class="small text-decoration-none text-primary fw-semibold">Esqueceu a senha?</a>
                </div>
                <input type="password" name="senha" class="form-control mt-1" placeholder="••••••••" required>
            </div>
            
            <button type="submit" class="btn btn-brand w-100 mt-4 mb-3">Entrar no Sistema</button>
        </form>

        <div class="text-center">
            <small class="text-muted">Ainda não tem conta? <a href="{{ url_for('auth.registro') }}" class="fw-bold text-decoration-none">Criar Nova Conta</a></small>
        </div>
    </div>
</body>
</html>
