<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Nova Senha - Trivium ERP</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 100%; max-width: 440px; padding: 2.5rem; }
        .btn-brand { background-color: #059669; color: #fff; font-weight: 700; border-radius: 10px; padding: 12px; }
        .btn-brand:hover { background-color: #047857; color: #fff; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="text-center mb-4">
            <h4 class="fw-bold text-dark mb-1">Cadastrar Nova Senha</h4>
            <p class="text-muted small">Crie uma nova senha de acesso para sua conta</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} small py-2">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">
            <div class="mb-3">
                <label class="form-label small fw-bold">Nova Senha</label>
                <input type="password" name="nova_senha" class="form-control" minlength="4" placeholder="••••••••" required>
            </div>
            <div class="mb-4">
                <label class="form-label small fw-bold">Confirmar Nova Senha</label>
                <input type="password" name="confirma_senha" class="form-control" minlength="4" placeholder="••••••••" required>
            </div>
            
            <button type="submit" class="btn btn-brand w-100 mb-3">Salvar Nova Senha</button>
        </form>
    </div>
</body>
</html>
