<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etapa Concluída - Trivium ERP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100 p-3">
    <div class="card border-0 shadow-sm rounded-4 p-4 text-center" style="max-width: 450px;">
        <div class="text-success mb-3">
            <i class="bi bi-check-circle-fill" style="font-size: 4rem;"></i>
        </div>
        <h4 class="fw-bold text-dark mb-1">Etapa Concluída com Sucesso!</h4>
        <p class="text-muted small mb-3">
            A fase <strong>{{ etapa.titulo_fase }}</strong> da OS-{{ "%04d"|format(servico.numero_sequencial_empresa) }} foi sincronizada no sistema de <strong>{{ empresa.razao_social }}</strong> com fotos e assinatura.
        </p>
        <span class="badge bg-success-subtle text-success border py-2 mb-3">Status: Concluído</span>
        <small class="text-muted d-block">Pode fechar esta página.</small>
    </div>
</body>
</html>
